name: Build lightweight Windows release

on:
  push:
    tags:
      - 'v*'
      - '!v0.34.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing lightweight version tag (for example v0.35.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - name: Validate release tag
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$' -or $env:RELEASE_TAG -like 'v0.34.*') {
            throw 'Use a lightweight release tag such as v0.35.0.'
          }
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:game
      - name: Build signed lightweight installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'Update signing key is missing.' }
          rustup toolchain install stable --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default stable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build:lightweight -- -- --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node desktop/lightweight-release.cjs
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $out = 'dist/lightweight-release'
          # Existing Electron 0.34.0 installs still read this feed. Its equal version
          # keeps them on Electron and avoids serving a Tauri installer to that updater.
          gh release download v0.34.0 --repo $env:GITHUB_REPOSITORY --pattern latest.yml --dir $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = $env:RELEASE_TAG.Substring(1)
          $installer = "$out/LittleTownChroniclesLite-Setup-$version.exe"
          $assets = @($installer, "$installer.sig", "$out/latest.json", "$out/latest.yml")
          $notes = 'Windows x64軽量版です。Electron版のプレイヤーは、旧版でセーブを書き出してから軽量版に取り込んでください。'
          gh release create $env:RELEASE_TAG @assets --repo $env:GITHUB_REPOSITORY --verify-tag --draft --title "小さな町の年代記 軽量版 $env:RELEASE_TAG" --notes $notes
          exit $LASTEXITCODE
