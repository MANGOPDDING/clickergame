name: Build Windows release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag (for example v0.34.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - name: Validate release tag
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw 'Use a release tag such as v0.34.0.'
          }
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Confirm public update feed
        if: ${{ github.event.repository.private }}
        run: throw 'The update feed repository must be public.'
      - run: npm ci
      - run: npm run test:game
      - name: Build Windows installer and update metadata
        env:
          JOURNEY_RELEASE_REPOSITORY: ${{ github.repository }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:RELEASE_TAG -cne "v$version") {
            throw "The tag must match package.json: v$version"
          }
          npm run build:windows
      - name: Create a draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = "dist/release/LittleTownChronicles-Setup-$($env:RELEASE_TAG.Substring(1)).exe"
          $assets = @($setup, "$setup.blockmap", 'dist/release/latest.yml')
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) {
              throw "Missing release file $asset"
            }
          }
          gh release create $env:RELEASE_TAG @assets --repo $env:GITHUB_REPOSITORY --verify-tag --draft --generate-notes
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub could not create the draft release."
          }
